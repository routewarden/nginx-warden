worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Point lua_package_path to the routewarden library
    lua_package_path "/usr/local/openresty/site/lualib/?.lua;/etc/nginx/lua/lib/?.lua;/etc/nginx/lua/lib/?/init.lua;;";

    # Initialize RouteWarden in master/worker initialization phase
    init_by_lua_block {
        local routewarden = require("resty.routewarden")

        -- Configure RouteWarden instance
        warden = routewarden.new({
            enabled = true,
            check_query = true,
            security_log = true,
            methods = { "GET", "HEAD" },
            allowed_ips = {
                "127.0.0.1",
                "10.0.0.0/8"
            },
            response = {
                mode = "json",
                status_code = 403
            }
        })
    }

    server {
        listen 80;
        server_name localhost;

        # Protect sensitive paths across all locations
        access_by_lua_block {
            warden:check()
        }

        location / {
            root   /usr/local/openresty/nginx/html;
            index  index.html;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

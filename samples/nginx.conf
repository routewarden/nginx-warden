worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    lua_package_path "/usr/local/openresty/site/lualib/?.lua;/usr/local/openresty/site/lualib/?/init.lua;/etc/nginx/lua/lib/?.lua;/etc/nginx/lua/lib/?/init.lua;;";

init_by_lua_block {
    local routewarden = require("resty.routewarden")

    -- 1. Port 8080: Core & JSON mode (custom patterns, IP allowlist, check_query, debug, security_log)
    warden_8080 = routewarden.new({
        debug = true,
        security_log = true,
        check_query = true,
        path_patterns = { [[(?i)^/admin/secret.*$]] },
        allow_patterns = { [[(?i)^/api/healthz$]] },
        allowed_ips = { "192.168.100.50", "10.99.0.0/16" },
        methods = { "GET", "POST" },
        response = {
            mode = "json",
            status_code = 403,
            headers = {
                ["X-RouteWarden-Protection"] = "Active"
            },
            body = [[{"error":"Access Denied","security":"routewarden"}]]
        }
    })

    -- 2. Port 8081: HTML mode
    warden_8081 = routewarden.new({
        response = {
            mode = "html",
            status_code = 403,
            headers = {
                ["X-RouteWarden-Mode"] = "html"
            },
            body = "<html><body><h1>Access Denied by RouteWarden</h1></body></html>"
        }
    })

    -- 3. Port 8082: Plain Text mode
    warden_8082 = routewarden.new({
        response = {
            mode = "text",
            status_code = 403,
            headers = {
                ["X-RouteWarden-Mode"] = "text"
            },
            body = "Access Forbidden: RouteWarden Text Mode"
        }
    })

    -- 4. Port 8083: XML mode
    warden_8083 = routewarden.new({
        response = {
            mode = "xml",
            status_code = 403,
            headers = {
                ["X-RouteWarden-Mode"] = "xml"
            }
        }
    })

    -- 5. Port 8084: Captcha mode (Turnstile challenge)
    warden_8084 = routewarden.new({
        response = {
            mode = "captcha",
            status_code = 403,
            captcha = {
                provider = "turnstile",
                site_key = "0x4AAAAAAtestkey",
                title = "Security Verification Challenge"
            }
        }
    })

    -- 6. Port 8085: Redirect mode
    warden_8085 = routewarden.new({
        response = {
            mode = "redirect",
            status_code = 302,
            redirect_url = "https://honeypot.local/sinkhole"
        }
    })

    -- 7. Port 8086: RateLimitChallenge mode (HTTP 429 + Retry-After: 180)
    warden_8086 = routewarden.new({
        response = {
            mode = "rateLimitChallenge",
            status_code = 429,
            retry_after_seconds = 180
        }
    })

    -- 8. Port 8087: FakeSuccess / Decoy mode
    warden_8087 = routewarden.new({
        response = {
            mode = "fakeSuccess"
        }
    })

    -- 9. Port 8088: GzipBomb mode
    warden_8088 = routewarden.new({
        response = {
            mode = "gzipBomb",
            status_code = 200,
            gzip_bomb_mb = 1
        }
    })

    -- 10. Port 8089: SilentDrop mode
    warden_8089 = routewarden.new({
        response = {
            mode = "silentDrop"
        }
    })

    -- 11. Port 8090: InfiniteStream mode
    warden_8090 = routewarden.new({
        response = {
            mode = "infiniteStream",
            status_code = 200,
            stream_size_mb = 2
        }
    })

    -- 12. Port 8091: Proxy mode (honeypot upstream)
    warden_8091 = routewarden.new({
        response = {
            mode = "proxy",
            proxy_url = "/__honeypot_proxy"
        }
    })

    -- 13. Port 8092: Disabled flag test
    warden_8092 = routewarden.new({
        enabled = false
    })

    -- 14. Port 8093: Methods filter test (inspects ONLY POST and DELETE; GET bypasses)
    warden_8093 = routewarden.new({
        methods = { "POST", "DELETE" },
        response = {
            mode = "json",
            status_code = 403
        }
    })
}

# NOTE: All server blocks use content_by_lua_block for the "upstream reached" fallback.
# Using the NGINX `return` directive would execute at the rewrite phase (before access phase),
# which bypasses access_by_lua_block entirely. content_by_lua_block runs AFTER access phase.

# 1. Port 8080: Core & JSON mode
server {
    listen 8080;
    location / {
        access_by_lua_block {
            warden_8080:check()
        }
        content_by_lua_block {
            ngx.header["Content-Type"] = "text/plain"
            ngx.say("OK: Upstream Reached (8080)")
        }
    }
}


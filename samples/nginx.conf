# 12. Port 8091: Proxy mode (honeypot upstream)
server {
    listen 8091;
    location /__honeypot_proxy {
        internal;
        proxy_pass http://honeypot:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        access_by_lua_block {
            warden_8091:check()
        }
        content_by_lua_block {
            ngx.header["Content-Type"] = "text/plain"
            ngx.say("OK: Upstream Reached (8091)")
        }
    }
}

